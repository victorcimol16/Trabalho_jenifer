<style>
/* Tela única: faixa fina de cabeçalho e a maquete ocupando o resto. A ficha abre como uma folha de papel por cima. */
:root{
  --bg:#e6e4dd; --paper:#f7f5ef; --ink:#23211d; --muted:#6a655b; --line:#c9c4b8; --red:#9b2b2c;

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

:root[data-theme="dark"]{

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.5;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

.app{height:100%;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:4px 24px;flex-wrap:wrap;padding-inline:20px;padding-block:12px 10px;border-bottom:1px solid var(--line)}
.top h1{margin:0;font-weight:500;font-size:24px;line-height:1.2}
.top h1 span{font-weight:400;font-style:italic;color:var(--muted)}
.top p{margin:0;font-size:16px;color:var(--muted)}
.top p strong{font-weight:500;color:var(--ink)}

.stage{position:relative;flex:1;min-height:420px;background:var(--stage);overflow:hidden;touch-action:none}
.stage canvas{display:block;width:100%;height:100%}
.pins{position:absolute;inset:0;pointer-events:none}
.pinlbl{position:absolute;left:0;top:0;pointer-events:auto;background:var(--paper);color:var(--ink);border:1px solid var(--ink);border-radius:3px;padding:3px 9px 4px;cursor:pointer;font-family:var(--serif);font-size:15px;line-height:1.2;white-space:nowrap}
.pinlbl.sp{border-color:var(--red);color:var(--red)}
.pinlbl:hover,.pinlbl.hot{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.hint{position:absolute;left:16px;bottom:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-family:var(--ui);font-size:13px;color:var(--muted)}
.hint button{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:6px 10px;cursor:pointer;font-family:var(--ui);font-size:13px;min-height:34px}
.hint button:hover{border-color:var(--ink)}
.fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted)}
@media (max-width:600px){.pinlbl{font-size:13px;padding:2px 7px 3px}.hint span{display:none}.top h1{font-size:21px}}

/* Folha */
.ov{position:fixed;inset:0;background:var(--shade);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.sheet{position:relative;background:var(--paper);color:var(--ink);width:min(760px,100%);max-height:min(90vh,980px);overflow:auto;border-radius:2px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.sh-head{position:sticky;top:0;background:var(--paper);padding:22px 28px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.sh-head h2{margin:0;font-weight:500;font-size:34px;line-height:1.1;text-wrap:balance}
.sh-head p{margin:4px 0 0;font-style:italic;color:var(--muted)}
.x{flex:none;background:none;border:1px solid var(--line);border-radius:3px;width:40px;height:40px;cursor:pointer;font-family:var(--ui);font-size:20px;line-height:1}
.x:hover{border-color:var(--ink)}
.sh-body{padding:6px 28px 30px;max-width:68ch}
.sh-body h3{margin:26px 0 8px;font-weight:600;font-size:20px}
.sh-body p{margin:0 0 10px}
.sh-body .who{color:var(--muted);font-size:16px}
ol.evo{margin:0 0 6px;padding-left:22px}
ol.evo li{margin-bottom:10px}
ol.evo li::marker{color:var(--muted)}
ol.evo li:last-child{color:var(--red)}
ol.evo q,ol.evo .ref{display:block;font-size:16px}
ol.evo q{font-style:italic;color:var(--ink)}
ol.evo li:last-child q{color:var(--red)}
.ref{color:var(--muted);font-size:15px}
blockquote{margin:0 0 14px;padding:0 0 0 16px;border-left:2px solid var(--red);font-style:italic;font-size:19px}
blockquote .ref{display:block;font-style:normal;margin-top:2px}
dl.cc{margin:0}
dl.cc dt{font-weight:600}
dl.cc dd{margin:0 0 10px}
ul.now{margin:0;padding-left:20px}
ul.now li{margin-bottom:6px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

 { id:"pasto", n:"02", name:"Casa de pasto", sub:"Estômago do organismo", spec:true,

       {k:"sao",t:"Quitandeira próspera",q:"a sua quitanda era a mais bem afreguesada do bairro.",r:"cap. I"},

       {k:"ag",t:"Animal de carga",q:"trabalhando e mais a amiga como uma junta de bois",r:"cap. I"},
       {k:"deg",t:"Descarte",p:"Denunciada aos herdeiros do antigo dono quando João Romão quer casar com Zulmira, ela se mata com a faca de cozinha.",r:"após o cap. X"}]},
   quotes:[
     {q:"A casa de pasto fermentava revolucionada, como um estômago de bêbedo depois de grande bródio",r:"cap. VII"},

     ["Zoomorfização","Bertoleza e João Romão trabalham \"como uma junta de bois\"; a casa de pasto é um estômago."],

     ["Meio social","A escravidão continua por dentro da relação: ela trabalha e ele acumula."]],

 { id:"casa35", n:"03", name:"Casinha nº 35", sub:"Jerônimo e Piedade", spec:true,

 { id:"casa9", n:"04", name:"Casinha nº 9", sub:"Rita Baiana", spec:true,

   now:["Hipersexualização da mulher negra e mestiça na mídia e na publicidade.","Estereótipo da \"mulata\" que ainda aparece no carnaval e em piadas."] },

 { id:"casa15", n:"05", name:"Casinha nº 15", sub:"Pombinha e Dona Isabel", spec:true,

   specimen:{ name:"Pombinha", diag:"Contaminação moral pelo convívio com o meio",

       {k:"sao",t:"Flor do cortiço",q:"A filha era a flor do cortiço.",r:"cap. III"},
       {k:"ag",t:"Absorve as misérias",q:"toda a súmula daquelas paixões e daqueles ressentimentos",r:"cap. VI"},
       {k:"ag",t:"Contato com Léonie",q:"Não tens que recear: minha casa é muito sossegada...",r:"cap. IX · fala de Léonie"},
       {k:"deg",t:"Ciclo reproduzido",p:"Separa-se do marido, torna-se prostituta ao lado de Léonie e passa a proteger Juju, que segue o mesmo caminho.",r:"após o cap. X"}]},

   concepts:[

     ["Determinismo","O destino dela repete o de Léonie, e Juju repete o dela."],
     ["Positivismo","As misérias são comparadas à \"evaporação de um lameiro\", como um gás tóxico."]],
   now:["Falta de oportunidade de estudo e trabalho para jovens de periferia.","Exploração sexual de meninas em situação de pobreza.","Ciclo da pobreza passado de geração em geração."] },

 { id:"patio", n:"06", name:"Pátio, tinas e bicas", sub:"Pulmões e pele", spec:false,

   quotes:[

   concepts:[

   now:["Saneamento precário: banheiro e água compartilhados, esgoto a céu aberto.","A doença ligada à moradia, como a febre amarela do século XIX, ainda existe com dengue e outras."] },

 { id:"pedreira", n:"07", name:"Pedreira", sub:"Esqueleto e músculos", spec:false,

   concepts:[

 { id:"capinzal", n:"08", name:"Capinzal e mangueiras", sub:"Sistema dos instintos", spec:false,

 { id:"sobrado", n:"09", name:"Sobrado do Miranda", sub:"Cabeça da elite", spec:false,

const BYID = Object.fromEntries(HOT.map(h=>[h.id,h]));
const CONCEPTS = [
  {t:"Determinismo",d:"Hippolyte Taine: o comportamento humano é determinado por raça, meio e momento histórico. Não há livre escolha.",s:"\"O espécime não decidiu; foi determinado.\""},

const ov=document.getElementById("ov"), sheet=document.getElementById("sheet");
let lastFocus=null;
function openSheet(id){
  const h=BYID[id]; if(!h) return;
  lastFocus=document.activeElement;
  let evo="";
  if(h.specimen){
    evo=`<h3>Como ${esc(h.specimen.name)} muda</h3>
      <p>Diagnóstico: <em>${esc(h.specimen.diag.toLowerCase())}</em>.</p>
      <ol class="evo">${h.specimen.stages.map(s=>`<li>${esc(s.t)}${s.q?`<q>${esc(s.q)}</q><span class="ref">${esc(s.r)}</span>`:`<span class="ref">${esc(s.p)} (${esc(s.r)})</span>`}</li>`).join("")}</ol>`;
  } else if(h.agent){
    evo=`<h3>Papel na história</h3><p>${esc(h.agent)}</p>`;
  }
  sheet.innerHTML=`
    <div class="sh-head">
      <div><h2 id="sh-title">${esc(h.name)}</h2><p>No corpo do cortiço: ${esc(h.organ.toLowerCase())}. ${esc(h.fn)}.</p></div>
      <button class="x" id="close" aria-label="Fechar">×</button>
    </div>
    <div class="sh-body">
      <h3>O lugar</h3>
      <p>${esc(h.desc)}</p>
      <p class="who">Quem aparece aqui: ${h.who.map(esc).join(", ")}.</p>
      ${evo}
      <h3>No livro</h3>
      ${h.quotes.map(q=>`<blockquote>“${esc(q.q)}”<span class="ref">${esc(q.r)}</span></blockquote>`).join("")}
      <h3>Conceitos</h3>
      <dl class="cc">${h.concepts.map(([c,t])=>`<dt>${esc(c)}</dt><dd>${esc(t)}</dd>`).join("")}</dl>
      <h3>E hoje?</h3>
      <ul class="now">${h.now.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>
    </div>`;
  ov.hidden=false; sheet.scrollTop=0;
  document.getElementById("close").addEventListener("click",closeSheet);
  document.getElementById("close").focus();
  setSelected(id);
}
function closeSheet(){ ov.hidden=true; setSelected(null); if(lastFocus&&lastFocus.focus) lastFocus.focus(); }

  // ---- tamanho e laço
  function resize(){ const w=stage.clientWidth,h=stage.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h;
    camera.fov = w<600?50:36; camera.updateProjectionMatrix(); }
  new ResizeObserver(resize).observe(stage); resize();
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const tmp=new THREE.Vector3(); const clock=new THREE.Clock();
  function loop(){
    const t=clock.getElapsedTime();
    if(!reduce) smoke.forEach(s=>{ const k=((t*.35+s.o)%3)/3; s.m.position.y=3.6+k*3; s.m.scale.setScalar(.6+k*1.4); s.m.material.opacity=.65*(1-k); });
    pl.intensity=.75+Math.sin(t*3)*.12;
    controls.update(); renderer.render(scene,camera);
    const w=stage.clientWidth,h=stage.clientHeight;
    pins.forEach(p=>{ tmp.copy(p.v).project(camera); if(tmp.z>1||tmp.z<-1){ p.el.hidden=true; return; } p.el.hidden=false;
      p.el.style.transform=`translate(${(tmp.x*.5+.5)*w}px,${(-tmp.y*.5+.5)*h}px) translate(-50%,-100%)`; });
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
